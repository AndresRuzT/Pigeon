server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

spring:
  application:
    name: pigeon

  datasource:
    url: ${PIGEON_DB_URL:jdbc:postgresql://localhost:5432/pigeon}
    username: ${PIGEON_DB_USER:pigeon_app}
    password: ${PIGEON_DB_PASSWORD:pigeon_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PigeonHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${PIGEON_RABBIT_HOST:localhost}
    port: ${PIGEON_RABBIT_PORT:5672}
    username: ${PIGEON_RABBIT_USER:guest}
    password: ${PIGEON_RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 5
        prefetch: 10

  mail:
    host: ${PIGEON_SMTP_HOST:localhost}
    port: ${PIGEON_SMTP_PORT:1025}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

pigeon:
  security:
    jwt:
      public-key-location: ${PIGEON_JWT_PUBLIC_KEY:classpath:certs/app.pub}
  messaging:
    high-priority-ttl-ms: ${PIGEON_HIGH_PRIORITY_TTL_MS:60000}
  outbox:
    poll-interval-ms: 500

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
