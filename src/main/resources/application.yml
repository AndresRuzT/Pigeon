server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

spring:
  application:
    name: pigeon

  datasource:
    url: ${PIGEON_DB_URL:jdbc:postgresql://localhost:${PIGEON_DB_PORT:5433}/pigeon}
    username: ${PIGEON_DB_USER:pigeon_app}
    password: ${PIGEON_DB_PASSWORD:pigeon_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PigeonHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${PIGEON_RABBIT_HOST:localhost}
    port: ${PIGEON_RABBIT_PORT:5672}
    username: ${PIGEON_RABBIT_USER:guest}
    password: ${PIGEON_RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 5
        prefetch: 10

  mail:
    host: ${PIGEON_SMTP_HOST:localhost}
    port: ${PIGEON_SMTP_PORT:1025}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

pigeon:
  security:
    jwt:
      public-key-location: ${PIGEON_JWT_PUBLIC_KEY:classpath:certs/app.pub}
  messaging:
    high-priority-ttl-ms: ${PIGEON_HIGH_PRIORITY_TTL_MS:60000}
  outbox:
    poll-interval-ms: 500
  providers:
    sms:
      base-url: ${PIGEON_SMS_BASE_URL:http://localhost:8089}
    push:
      base-url: ${PIGEON_PUSH_BASE_URL:http://localhost:8089}

resilience4j:
  circuitbreaker:
    instances:
      sms:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      push:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      sms:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      push:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
