<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transfer Completed</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px;">
        <h2 style="color: #1e3a8a;">Pigeon Bank - Transfer Confirmation</h2>
        <p>Your transfer has been processed successfully.</p>
        <p>Amount: <strong th:text="${amount}">0.00</strong> <span th:text="${currency}">USD</span></p>
        <p>From Account: ending in <strong th:text="${accountLast4}">****</strong></p>
        <p>Beneficiary: <strong th:text="${beneficiaryName}">Beneficiary</strong></p>
    </div>
</body>
</html>
