<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Urgent Security Alert</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px;">
        <h2 style="color: #b91c1c;">Pigeon Bank - Fraud Alert</h2>
        <p>A suspicious transaction was detected on card ending in <strong th:text="${cardLast4}">****</strong>.</p>
        <p>Amount: <strong th:text="${amount}">0.00</strong> <span th:text="${currency}">USD</span></p>
        <p>Merchant: <strong th:text="${merchantName}">Unknown Merchant</strong></p>
        <p style="color: #b91c1c; font-weight: bold;">If this was not you, lock your card immediately in the mobile banking app.</p>
    </div>
</body>
</html>
