<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Security Verification Code</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px;">
        <h2 style="color: #1e3a8a;">Pigeon Bank - Verification Code</h2>
        <p>Your one-time security verification code is:</p>
        <div style="font-size: 28px; font-weight: bold; letter-spacing: 4px; color: #1e40af; padding: 15px 0;" th:text="${otpCode}">000000</div>
        <p>This code will expire in <span th:text="${expiresInSeconds} ?: '300'">300</span> seconds.</p>
        <p style="font-size: 12px; color: #6b7280;">If you did not request this code, please contact bank security immediately.</p>
    </div>
</body>
</html>
